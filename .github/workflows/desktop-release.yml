name: Windows desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:desktop
      - run: pnpm build:desktop
      - name: Verify release version and installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match package version" }
          if (-not (Test-Path -LiteralPath "release/Intercom-Push-Generator-Setup-$version.exe")) { throw "Installer missing" }
      - name: Create Yandex Disk update manifest
        run: node scripts/create-update-manifest.mjs
      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = "release-notes/$version.md"
          if (Test-Path -LiteralPath $notes) {
            gh release create "v$version" "release/Intercom-Push-Generator-Setup-$version.exe" "release/latest.yml" "release/latest.json" --title "Генератор пушей v$version" --notes-file $notes
          } else {
            gh release create "v$version" "release/Intercom-Push-Generator-Setup-$version.exe" "release/latest.yml" "release/latest.json" --title "Генератор пушей v$version" --generate-notes
          }

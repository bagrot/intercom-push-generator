name: macOS desktop release

on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-universal:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:desktop
      - run: pnpm build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create macOS disk image
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          app=$(find release/mac-universal -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          mkdir -p release/dmg-root
          cp -R "$app" release/dmg-root/
          ln -s /Applications release/dmg-root/Applications
          hdiutil create -volname "Генератор пушей" \
            -srcfolder release/dmg-root -ov -format UDZO \
            "release/Intercom-Push-Generator-${version}-mac-universal.dmg"
          hdiutil verify "release/Intercom-Push-Generator-${version}-mac-universal.dmg"
      - name: Verify macOS package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test -f "release/Intercom-Push-Generator-${version}-mac-universal.dmg"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "mac-v${version}" ]]; then
            echo "Tag does not match package version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-universal
          path: release/*-mac-universal.dmg
      - name: Publish test macOS release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="mac-v${version}"
          dmg="release/Intercom-Push-Generator-${version}-mac-universal.dmg"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$dmg" --clobber
          else
            gh release create "$tag" "$dmg" --target "$GITHUB_SHA" \
              --title "Генератор пушей ${version} — macOS (тестовая сборка)" \
              --notes-file "release-notes/mac-${version}.md" --prerelease
          fi

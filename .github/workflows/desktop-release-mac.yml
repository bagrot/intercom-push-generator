name: macOS desktop release

on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:desktop
      - run: pnpm build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test -f "release/Intercom-Push-Generator-${version}-mac-universal.dmg"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "mac-v${version}" ]]; then
            echo "Tag does not match package version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-universal
          path: release/*-mac-universal.dmg
      - name: Publish test macOS release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "mac-v${version}" "release/Intercom-Push-Generator-${version}-mac-universal.dmg" \
            --title "Генератор пушей ${version} — macOS (тестовая сборка)" \
            --notes-file "release-notes/mac-${version}.md" --prerelease
